# cargo-deny configuration
# Policy: allow permissive OSS licenses; deny copyleft and proprietary.
# To add an exception, add the crate name to the relevant [[licenses.exceptions]] entry.

[licenses]
# Confidence threshold for license detection (0.0–1.0)
confidence-threshold = 0.8

allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "BSL-1.0",  # Boost Software License
]
# Any license not in `allow` (GPL, LGPL, AGPL, SSPL, proprietary, ...) is rejected.
# The explicit `deny` list was removed from cargo-deny (EmbarkStudios/cargo-deny#611).

# Crates whose licenses are checked but whose specific license is known and accepted
exceptions = []

[bans]
# Deny multiple versions of the same crate to keep the dependency tree clean.
multiple-versions = "warn"
deny = []

[advisories]
# Point to the RustSec advisory database.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Every vulnerable, unmaintained, unsound or yanked crate fails the check unless
# listed below. Each exception must name the advisory, explain why it cannot be
# fixed yet, and be removed as soon as an upstream fix lands.
# Last audited: 2026-09-25 (issue #1755) — run `cargo deny check advisories`.
ignore = [
  # `derivative` is unmaintained (informational, no known vulnerability).
  # Pulled in only as a proc-macro via soroban-sdk -> soroban-env-host ->
  # ark-bls12-381/ark-ec/ark-ff 0.4. No safe upgrade exists: arkworks dropped it
  # in 0.5, but soroban-env-host 23.x still pins arkworks 0.4.
  { id = "RUSTSEC-2024-0388", reason = "transitive via soroban-env-host (arkworks 0.4); no upgrade path until soroban-sdk moves to arkworks 0.5; reassess by 2026-12-31", expires = "2026-12-31" },
  # `paste` is unmaintained (informational, no known vulnerability).
  # Same path as above: proc-macro dependency of ark-ff 0.4 via soroban-env-host.
  { id = "RUSTSEC-2024-0436", reason = "transitive via soroban-env-host (arkworks 0.4); no upgrade path until soroban-sdk moves to arkworks 0.5; reassess by 2026-12-31", expires = "2026-12-31" },
]
