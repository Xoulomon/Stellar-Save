[package]
name = "stellar-save"
description = "Rotational Savings and Credit Association (ROSCA) on Stellar Soroban"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
version.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-save-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
# Enable coverage instrumentation (used by cargo-tarpaulin / cargo-llvm-cov)
coverage = []
