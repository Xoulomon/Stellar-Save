[package]
name = "stellar-save"
description = "Rotational Savings and Credit Association (ROSCA) on Stellar Soroban"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
version.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-save-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# proptest: used in property_tests.rs, fuzz_tests.rs, escrow_property_tests.rs,
#           governance_property_tests.rs, insurance_property_tests.rs
proptest = "1.5.0"
# ed25519-dalek: used in security.rs test helpers to construct signed payloads
ed25519-dalek = { version = "2", features = ["rand_core"] }

[features]
# Enable coverage instrumentation (used by cargo-tarpaulin / cargo-llvm-cov)
coverage = []
